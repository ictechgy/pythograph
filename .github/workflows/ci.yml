name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
        # 대상 코드를 실행 중인 인터프리터의 ast로 파싱하므로 패키지 분류자에 적은 모든 Python(3.10–3.14)을 검증한다.
        # 순수 Python 도구라 OS 차이가 작아 macOS 잡은 늘리지 않는다.
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv 버전과 빌드 백엔드(build-constraints.txt)는 고정한다. 올리는 절차는 RELEASING.md "빌드 도구 고정"에 있다.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format
        run: uv run ruff format --check src tests scripts
      - name: Typecheck
        run: uv run mypy
      - name: Tests and coverage gate
        run: uv run pytest --cov --cov-report=term-missing
      - name: CLI contract (development install)
        run: uv run python scripts/verify_cli_contract.py
      # 자기 분석: 이 저장소의 소스(합성 fixture 포함)가 모두 파싱되고 그래프가 만들어지는지 확인한다. 공개 앱 도그푸딩은 DOGFOOD.md다.
      - name: Self-analysis
        shell: bash
        run: |
          uv run pythograph graph --project . --generated-at 2026-01-01T00:00:00.000Z --revision self > "$RUNNER_TEMP/self-graph.json"
          uv run python -c "import json,sys; s=json.load(open(sys.argv[1], encoding='utf-8'))['statistics']; assert s['unparsedFiles'] == 0, s['unparsedFiles']" "$RUNNER_TEMP/self-graph.json"
      - name: CLI contract (built wheel in a clean environment)
        shell: bash
        run: |
          uv build --build-constraints build-constraints.txt --require-hashes
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          uv run python scripts/verify_cli_contract.py --executable "$RUNNER_TEMP/wheel-venv/bin/pythograph"

  # Windows에는 디렉터리 핸들 열기(dir_fd)·O_NOFOLLOW·O_NONBLOCK·FIFO·POSIX 권한 비트가 없어 소스 읽기가 경로 재검사와
  # 파일 핸들 신원 대조 대체 경로를 타고, Git for Windows 기본 설정(core.autocrlf=true), 텍스트 모드 CRLF, ANSI 코드
  # 페이지 표준 입출력이 입출력 바이트를 바꾼다. 그 경로를 실제로 돈다. 신원 대조가 기대는 Windows stat·fstat 구현이
  # CPython 3.12에서 바뀌었으므로(FileIdInfo·GetFileInformationByName) 그 전후인 3.10과 3.13을 돈다. PYTHONUTF8·
  # PYTHONIOENCODING은 일부러 두지 않는다(기본 코드 페이지에서 UTF-8 출력을 확인해야 한다). PYTHOGRAPH_REQUIRE_SYMLINKS는
  # 러너가 링크를 만들 수 없으면 테스트를 시작하지 않게 해 링크 거부 테스트가 건너뛰기로 조용히 빠지지 않게 한다.
  # Lint·Format은 플랫폼과 무관한 결과라 위 잡에 맡긴다. Typecheck는 여기서도 돈다: mypy는 실행 플랫폼을 기본값으로 쓰므로
  # Windows에 없는 POSIX 전용 속성(`os.O_DIRECTORY`·`os.O_NOFOLLOW`·3.12 전 `os.set_blocking`)을 플랫폼 분기 밖에서 쓰면
  # 여기서 드러난다. 건너뛴 테스트와 이유는 `-rs`로 로그에 남긴다.
  verify-windows:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: ${{ matrix.python }}
      PYTHOGRAPH_REQUIRE_SYMLINKS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv 버전과 빌드 백엔드(build-constraints.txt)는 위 잡과 같게 고정한다.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
          enable-cache: true
      # .gitattributes가 체크아웃을 LF로 고정했는지 본다. 공유 벡터 sha256·fixture 바이트가 CRLF로 바뀌면 여기서 멈춘다.
      - name: Line endings
        run: |
          converted="$(git ls-files --eol | awk '$2 != "w/lf" && $2 != "w/none" && $2 != "w/-text"')"
          if [ -n "$converted" ]; then
            printf '%s\n' "$converted" >&2
            echo "the checkout has text files that are not LF; check .gitattributes" >&2
            exit 1
          fi
      - name: Install
        run: uv sync --locked
      - name: Typecheck
        run: uv run mypy
      - name: Tests and coverage gate
        run: uv run pytest --cov --cov-report=term-missing -rs
      - name: CLI contract (development install)
        run: uv run python scripts/verify_cli_contract.py
      - name: Self-analysis
        run: |
          uv run pythograph graph --project . --generated-at 2026-01-01T00:00:00.000Z --revision self > "$RUNNER_TEMP/self-graph.json"
          uv run python -c "import json,sys; s=json.load(open(sys.argv[1], encoding='utf-8'))['statistics']; assert s['unparsedFiles'] == 0, s['unparsedFiles']" "$RUNNER_TEMP/self-graph.json"
      # Windows 가상 환경은 실행 파일을 bin/이 아니라 Scripts/에 둔다.
      - name: CLI contract (built wheel in a clean environment)
        run: |
          uv build --build-constraints build-constraints.txt --require-hashes
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/Scripts/python.exe" dist/*.whl
          uv run python scripts/verify_cli_contract.py --executable "$RUNNER_TEMP/wheel-venv/Scripts/pythograph.exe"
