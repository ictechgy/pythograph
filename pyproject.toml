[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pythograph"
version = "0.1.0"
description = "Static facts for Python (Django, Django REST framework, Flask) services for the isthmus bridge-facts exchange: HTTP route declarations from the standard-library ast, without importing the analyzed project."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ictechgy" }]
keywords = ["static-analysis", "http", "routes", "django", "django-rest-framework", "flask", "isthmus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
# 런타임 의존성은 없다. 분석은 표준 라이브러리 ast만 쓴다.
dependencies = []

[project.urls]
Homepage = "https://github.com/ictechgy/pythograph"
Issues = "https://github.com/ictechgy/pythograph/issues"

[project.scripts]
pythograph = "pythograph.cli.main:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.0",
    "mypy==1.18.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pythograph"]

[tool.hatch.build.targets.sdist]
include = ["/src/pythograph", "/README.md", "/README.ko.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pythograph"]
branch = true
omit = ["*/pythograph/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["fixtures", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PIE", "RET"]
ignore = [
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR2004",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/pythograph"]
